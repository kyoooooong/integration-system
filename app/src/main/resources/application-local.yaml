# 로컬 개발·시연용.
#
# 여기 있는 접속 정보는 비밀이 아니다. compose.yaml 이 같은 값을 공개하고 있고,
# 로컬 컨테이너 밖에서는 의미가 없다. 비밀이 아닌 값을 비밀인 척 다루면
# 진짜 비밀을 다루는 절차가 느슨해진다.
spring:
  datasource:
    # compose.yaml 이 노출하는 포트. 로컬에 설치된 PostgreSQL 과 충돌하지 않게 옮겼다.
    url: jdbc:postgresql://localhost:55432/stay
    username: stay
    password: stay

supplier:
  # Mock Supplier 는 반드시 별도 프로세스다. 같은 포트에 두면 무응답 모드가
  # 우리 워커 스레드를 점유해 연동 문제와 자원 고갈을 구분할 수 없게 된다.
  base-url: http://localhost:9090
  api-key: local-dev-key

catalog:
  sync:
    # 시연용으로 짧게 둔다. 수동 동기화 엔드포인트를 만들지 않은 대신이다 —
    # 시연에 필요한 것은 "장애를 고치면 다음 주기에 회복된다" 뿐이고,
    # 그 목적에 운영 표면을 늘릴 이유가 없다.
    interval: 10s

management:
  endpoint:
    health:
      show-details: always
