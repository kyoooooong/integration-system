# 전체 스택을 컨테이너로 띄운다. 리뷰어가 JDK 없이도 실행할 수 있다.
#
# 로컬 개발은 compose.yaml (PostgreSQL 만) + gradle bootRun 을 쓴다.
# 코드를 고칠 때마다 이미지를 다시 굽지 않기 위해서다.
#
#   cp .env.sample .env && docker compose -f compose.full.yaml up --build
services:
  postgres:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # 공급사 Mock 은 애플리케이션과 별도 프로세스이자 별도 컨테이너다.
  # 같은 프로세스에 두면 무응답 모드의 sleep 이 우리 워커 스레드를 점유해서
  # 연동 타임아웃 미동작과 자원 고갈을 구분할 수 없게 된다.
  mock-supplier:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: mock-supplier
    ports:
      - "9090:9090"

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: app
    depends_on:
      postgres:
        condition: service_healthy
      mock-supplier:
        condition: service_started
    environment:
      # prod 프로파일은 기본값을 두지 않는다. 아래 값 중 하나라도 비면 기동이 실패한다.
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SUPPLIER_BASE_URL: ${SUPPLIER_BASE_URL}
      SUPPLIER_API_KEY: ${SUPPLIER_API_KEY}
      CATALOG_SYNC_INTERVAL: ${CATALOG_SYNC_INTERVAL}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
